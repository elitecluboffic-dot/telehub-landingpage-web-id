<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DuoJump — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="select-header">
  <div class="brand">🛠️ Admin — Review Pembayaran</div>
  <button class="btn btn-ghost" id="btn-logout">Keluar</button>
</div>

<div class="admin-wrap">
  <div style="margin-bottom:18px">
    <button class="btn btn-ghost" data-status="pending">Pending</button>
    <button class="btn btn-ghost" data-status="approved">Approved</button>
    <button class="btn btn-ghost" data-status="rejected">Rejected</button>
  </div>
  <div id="payment-list"></div>
  <p id="empty-msg" class="hidden" style="color:var(--text-dim)">Tidak ada data.</p>
</div>

<script>
async function aapi(path, opts = {}) {
  const res = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw data;
  return data;
}

(async function guard() {
  try {
    const me = await aapi("/api/me");
    if (!me.user || me.user.role !== "admin") window.location.href = "/";
  } catch (e) { window.location.href = "/"; }
})();

document.getElementById("btn-logout").addEventListener("click", async () => {
  try { await aapi("/api/logout", { method: "POST" }); } catch (e) {}
  window.location.href = "/";
});

const listEl = document.getElementById("payment-list");
const emptyMsg = document.getElementById("empty-msg");

async function loadPayments(status) {
  listEl.innerHTML = "Memuat...";
  try {
    const res = await aapi(`/api/admin/payments?status=${status}`);
    listEl.innerHTML = "";
    emptyMsg.classList.toggle("hidden", res.payments.length > 0);
    for (const p of res.payments) {
      const card = document.createElement("div");
      card.className = "payment-card";
      card.innerHTML = `
        <img src="${p.image_data}" alt="bukti pembayaran" />
        <div class="payment-info">
          <div><strong>${p.username}</strong> <span style="color:var(--text-dim);font-size:12px">#${p.id}</span></div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:4px">${p.note ? "Catatan: " + p.note : "(tanpa catatan)"}</div>
          <div style="color:var(--text-dim);font-size:12px;margin-top:4px">${p.created_at}</div>
          ${status === "pending" ? `
            <div class="payment-actions">
              <button class="btn btn-green" data-action="approve" data-id="${p.id}">Approve</button>
              <button class="btn btn-danger" data-action="reject" data-id="${p.id}">Reject</button>
            </div>` : `<span class="status-pill ${p.status}">${p.status}</span>`}
        </div>
      `;
      listEl.appendChild(card);
    }
  } catch (e) {
    listEl.innerHTML = "Gagal memuat data.";
  }
}

document.querySelectorAll("[data-status]").forEach((btn) => {
  btn.addEventListener("click", () => loadPayments(btn.dataset.status));
});

listEl.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  btn.disabled = true;
  try {
    await aapi(`/api/admin/payments/${id}/${action}`, { method: "POST", body: JSON.stringify({}) });
    loadPayments("pending");
  } catch (e) {
    alert(e.error || "Gagal memproses");
    btn.disabled = false;
  }
});

loadPayments("pending");
</script>
</body>
</html>
