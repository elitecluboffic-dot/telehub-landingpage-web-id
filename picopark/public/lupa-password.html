<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lupa Password — DuoJump</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  #forgot-success {
    font-weight: 800;
    font-size: 1.05rem;
    line-height: 1.5;
    background: linear-gradient(90deg, #5ec2f0 0%, #ff6bcb 50%, #ffb347 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: forgot-success-shine 3s ease-in-out infinite;
    letter-spacing: 0.2px;
  }

  @keyframes forgot-success-shine {
    0% { background-position: 0% center; }
    50% { background-position: 100% center; }
    100% { background-position: 0% center; }
  }

  @media (prefers-reduced-motion: reduce) {
    #forgot-success {
      animation: none;
    }
  }
</style>
</head>
<body>
<div class="center-screen">
  <div class="auth-wrap">
    <div class="mascots">
      <div class="blob p1"></div>
      <div class="blob p2"></div>
    </div>
    <div class="auth-card">
      <div id="forgot-form">
        <h1>Lupa Password</h1>
        <p class="sub">Masukkan email yang kamu daftarkan. Kami kirim link reset password ke sana.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" autocomplete="email" placeholder="nama@email.com" />
        </div>
        <button class="btn btn-primary" id="btn-request-reset">Kirim Link Reset</button>
        <div class="error-msg" id="forgot-error"></div>
        <div class="success-msg" id="forgot-success"></div>
        <div class="toggle-row">
          <a href="/">Kembali ke halaman masuk</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const btnRequestReset = document.getElementById("btn-request-reset");
  const emailInput = document.getElementById("forgot-email");
  const errorBox = document.getElementById("forgot-error");
  const successBox = document.getElementById("forgot-success");

  function setError(msg) {
    errorBox.textContent = msg || "";
    successBox.textContent = "";
  }

  function setSuccess(msg) {
    successBox.textContent = msg || "";
    errorBox.textContent = "";
  }

  btnRequestReset.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    setError("");
    setSuccess("");

    if (!email) {
      setError("Email wajib diisi");
      return;
    }

    btnRequestReset.disabled = true;
    btnRequestReset.textContent = "Mengirim...";

    try {
      const res = await fetch("/api/request-reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || "Terjadi kesalahan, coba lagi");
      } else {
        setSuccess(
          data.message || "Jika email terdaftar, link reset sudah dikirim. Cek inbox atau folder spam kamu."
        );
        emailInput.value = "";
      }
    } catch (err) {
      setError("Gagal menghubungi server, coba lagi nanti");
    } finally {
      btnRequestReset.disabled = false;
      btnRequestReset.textContent = "Kirim Link Reset";
    }
  });

  emailInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btnRequestReset.click();
  });
</script>
</body>
</html>
