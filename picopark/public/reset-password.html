<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — DuoJump</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-screen">
  <div class="auth-wrap">
    <div class="mascots">
      <div class="blob p1"></div>
      <div class="blob p2"></div>
    </div>
    <div class="auth-card">
      <div id="reset-form">
        <h1>Reset Password</h1>
        <p class="sub" id="reset-sub">Masukkan password baru untuk akun kamu.</p>
        <div class="field">
          <label for="reset-password">Password Baru</label>
          <input id="reset-password" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="reset-password-confirm">Konfirmasi Password Baru</label>
          <input id="reset-password-confirm" type="password" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" id="btn-reset-password">Simpan Password Baru</button>
        <div class="error-msg" id="reset-error"></div>
        <div class="success-msg" id="reset-success"></div>
        <div class="toggle-row">
          <a href="/">Kembali ke halaman masuk</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";

  const form = document.getElementById("reset-form");
  const subText = document.getElementById("reset-sub");
  const passwordInput = document.getElementById("reset-password");
  const passwordConfirmInput = document.getElementById("reset-password-confirm");
  const btnReset = document.getElementById("btn-reset-password");
  const errorBox = document.getElementById("reset-error");
  const successBox = document.getElementById("reset-success");

  function setError(msg) {
    errorBox.textContent = msg || "";
    successBox.textContent = "";
  }

  function setSuccess(msg) {
    successBox.textContent = msg || "";
    errorBox.textContent = "";
  }

  if (!token) {
    subText.textContent = "Link reset tidak valid. Pastikan kamu membuka link lengkap dari email.";
    passwordInput.disabled = true;
    passwordConfirmInput.disabled = true;
    btnReset.disabled = true;
  }

  btnReset.addEventListener("click", async () => {
    const newPassword = passwordInput.value;
    const confirmPassword = passwordConfirmInput.value;
    setError("");
    setSuccess("");

    if (!newPassword || newPassword.length < 6) {
      setError("Password minimal 6 karakter");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("Konfirmasi password tidak cocok");
      return;
    }

    btnReset.disabled = true;
    btnReset.textContent = "Menyimpan...";

    try {
      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: newPassword }),
      });
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || "Terjadi kesalahan, coba lagi");
        btnReset.disabled = false;
        btnReset.textContent = "Simpan Password Baru";
      } else {
        setSuccess(data.message || "Password berhasil direset, silakan login.");
        passwordInput.disabled = true;
        passwordConfirmInput.disabled = true;
        btnReset.textContent = "Berhasil";
        setTimeout(() => {
          window.location.href = "/";
        }, 2000);
      }
    } catch (err) {
      setError("Gagal menghubungi server, coba lagi nanti");
      btnReset.disabled = false;
      btnReset.textContent = "Simpan Password Baru";
    }
  });

  passwordConfirmInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btnReset.click();
  });
</script>
</body>
</html>
