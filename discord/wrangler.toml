name = "telehub-api"
main = "src/index.js"
compatibility_date = "2026-07-27"
workers_dev = false

# Build otomatis: Cloudflare bakal jalanin perintah ini DULU sebelum deploy,
# biar folder web/dist (hasil build React) selalu ada waktu wrangler deploy
# jalan -- baik lewat GitHub Actions/Git integration MAUPUN manual di lokal.
[build]
command = "cd web && npm install && npm run build"

# Assets: ini yang bikin Worker ini bisa nampilin halaman React-nya sendiri
# (index.html, JS, CSS hasil build) tanpa perlu server terpisah.
# not_found_handling: karena ini React SPA, path apapun yang gak match file
# statis (misal /discord, /discord/apapun) tetap di-serve index.html,
# biar client-side routing React yang nentuin halaman apa yang ditampilkan.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Route custom domain: biar Worker ini tetap ke-mapping ke telehub.web.id/discord
# (kalau nggak ada ini, Cloudflare bakal hapus route ini setiap kali deploy
# dan Worker cuma bisa diakses lewat *.workers.dev)
[[routes]]
pattern = "telehub.web.id/discord*"
zone_name = "telehub.web.id"

# Database D1 - buat dulu dengan: wrangler d1 create telehub-db
# Terus copy "database_id" yang muncul ke sini
[[d1_databases]]
binding = "DB"
database_name = "telehub-db"
database_id = "94715e3b-25a8-46f4-8bd9-0cb795ac771c"

# Variabel non-rahasia (boleh langsung di sini)
[vars]
DUITKU_MERCHANT_CODE = "D24029"
DUITKU_ENV = "production"                     # ganti "production" kalau udah live
DUITKU_CALLBACK_URL = "https://telehub.web.id/discord/callback"
DUITKU_RETURN_URL = "https://telehub.web.id/discord/#/selesai"

# Rahasia (JANGAN taruh di sini, set lewat CLI, lihat README):
# - DUITKU_API_KEY
# - ADMIN_KEY
